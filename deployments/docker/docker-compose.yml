version: '3.8'

services:
  bluestone:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: oborges/bluestone:${BLUESTONE_IMAGE_TAG:-1.0.0}
    container_name: bluestone
    ports:
      - "2049:2049"   # NFS
      - "8080:8080"   # Metrics
      - "8081:8081"   # Health
    environment:
      # COS Configuration
      - BLUESTONE_COS_ENDPOINT=${COS_ENDPOINT}
      - BLUESTONE_COS_BUCKET=${COS_BUCKET}
      - BLUESTONE_COS_REGION=${COS_REGION:-us-south}
      - BLUESTONE_COS_API_KEY=${IBM_CLOUD_API_KEY}
      
      # Logging
      - BLUESTONE_LOGGING_LEVEL=${LOG_LEVEL:-info}
      - BLUESTONE_LOGGING_FORMAT=json
      
      # Cache
      - BLUESTONE_CACHE_METADATA_ENABLED=true
      - BLUESTONE_CACHE_DATA_ENABLED=true
    volumes:
      # Configuration
      - ./config.yaml:/etc/bluestone/config.yaml:ro
      
      # Cache storage
      - nfs-cache:/var/cache/bluestone
      
      # Logs (optional)
      - ./logs:/var/log/bluestone
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nfs-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nfs-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD before enabling the monitoring profile}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - nfs-network
    profiles:
      - monitoring

volumes:
  nfs-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  nfs-network:
    driver: bridge

