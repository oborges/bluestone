apiVersion: v1
kind: Service
metadata:
  name: bluestone
  labels:
    app: bluestone
spec:
  type: LoadBalancer
  selector:
    app: bluestone
  ports:
  # NFS only. Metrics and health have no authentication and stay inside the
  # cluster: the kubelet probes the pod directly, and bluestone-metrics below
  # is a ClusterIP service for the scraper.
  - name: nfs
    port: 2049
    targetPort: 2049
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: bluestone-metrics
  labels:
    app: bluestone
spec:
  type: ClusterIP
  selector:
    app: bluestone
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

