apiVersion: v1
kind: Service
metadata:
  name: bluestone
  labels:
    app: bluestone
spec:
  # Reachable from inside the cluster only. The export has no user
  # authentication, so a public load balancer would hand the bucket to anyone
  # who can reach it. For clients outside the cluster, change this to
  # LoadBalancer and restrict it: a private load balancer (on IBM Cloud, the
  # annotation service.kubernetes.io/ibm-load-balancer-cloud-provider-ip-type:
  # "private"), loadBalancerSourceRanges, or server.allowed_clients in the
  # ConfigMap.
  type: ClusterIP
  selector:
    app: bluestone
  ports:
  # NFS only. Metrics and health have no authentication and stay inside the
  # cluster: the kubelet probes the pod directly, and bluestone-metrics below
  # is a ClusterIP service for the scraper.
  - name: nfs
    port: 2049
    targetPort: 2049
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: bluestone-metrics
  labels:
    app: bluestone
spec:
  type: ClusterIP
  selector:
    app: bluestone
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

