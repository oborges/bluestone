apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluestone
  labels:
    app: bluestone
    version: v1
spec:
  # One gateway serves a bucket at a time: two writing the same bucket
  # corrupt each other's write-back state. Recreate stops the old pod before
  # the new one starts, so an upgrade never runs two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bluestone
  template:
    metadata:
      labels:
        app: bluestone
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bluestone
      # The image runs as uid and gid 1000; this lets it write its volumes.
      securityContext:
        fsGroup: 1000
      containers:
      - name: bluestone
        image: oborges/bluestone:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: nfs
          containerPort: 2049
          protocol: TCP
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        - name: BLUESTONE_COS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: bluestone-config
              key: cos.endpoint
        - name: BLUESTONE_COS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: bluestone-config
              key: cos.bucket
        - name: BLUESTONE_COS_REGION
          valueFrom:
            configMapKeyRef:
              name: bluestone-config
              key: cos.region
        - name: BLUESTONE_COS_API_KEY
          valueFrom:
            secretKeyRef:
              name: bluestone-secret
              key: ibm-cloud-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: config
          mountPath: /etc/bluestone
          readOnly: true
        - name: cache
          mountPath: /var/cache/bluestone
        - name: staging
          mountPath: /var/staging/bluestone
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: bluestone-config
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
      # Staging holds writes the gateway has accepted but not yet uploaded.
      # It must outlive the pod, or a restart loses them.
      - name: staging
        persistentVolumeClaim:
          claimName: bluestone-staging

