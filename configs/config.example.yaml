# Bluestone - Example Configuration
# Copy this file to config.yaml and update with your values

server:
  nfs_port: 2049
  nfs_version: "4"        # "4" (default), "3", or "dual"
  metrics_port: 8080
  health_port: 8081
  max_connections: 1000
  read_timeout: "30s"
  write_timeout: "30s"
  # Restrict which client addresses may connect to the NFS port. Entries are
  # CIDRs or single IPs. Empty (default) allows all clients; rejected
  # connections are dropped at TCP accept and logged. Use alongside OS or
  # cloud firewalls as defense in depth, similar to cloud security groups.
  # allowed_clients:
  #   - "10.0.1.0/24"
  #   - "192.168.7.5"
  # Per-connection NFS request parallelism. 0 (default) uses the built-in
  # value (64, like a kernel nfsd thread pool); 1 restores fully serial
  # request handling as an operational escape hatch.
  nfs_concurrent_handlers: 0

cos:
  # IBM Cloud COS endpoint
  # Examples:
  #   - s3.us-south.cloud-object-storage.appdomain.cloud
  #   - s3.us-east.cloud-object-storage.appdomain.cloud
  #   - s3.eu-gb.cloud-object-storage.appdomain.cloud
  endpoint: "s3.us-south.cloud-object-storage.appdomain.cloud"
  
  # Target bucket name
  bucket: "my-nfs-bucket"
  
  # Region
  region: "us-south"
  
  # Authentication type: "iam" or "hmac"
  auth_type: "iam"
  
  # IAM authentication (recommended)
  api_key: "your-ibm-cloud-api-key-here"
  service_id: "ServiceId-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  
  # HMAC authentication (alternative)
  # access_key: "your-access-key-here"
  # secret_key: "your-secret-key-here"
  
  # Connection settings
  max_retries: 3
  timeout: "30s"
  # Fast-fail SDK calls after repeated transport failures during a COS outage.
  circuit_breaker_enabled: true

cache:
  metadata:
    enabled: true
    size_mb: 256          # Memory cache size for metadata
    ttl_seconds: 60       # Time-to-live for cached metadata
    max_entries: 10000    # Maximum number of cached entries
  
  data:
    enabled: true
    size_gb: 10           # Disk cache size for file data
    path: "/var/cache/bluestone"
    chunk_size_kb: 1024   # Size of cache chunks

performance:
  read_ahead_kb: 8192           # Read-ahead window for cached parallel range fetches
  write_buffer_kb: 4096         # Write buffer size
  multipart_threshold_mb: 100   # Files larger than this use multipart upload
  multipart_chunk_mb: 10        # Size of each multipart chunk
  worker_pool_size: 100         # Number of worker goroutines
  max_concurrent_reads: 50      # Maximum concurrent read operations
  max_concurrent_writes: 25     # Maximum concurrent write operations
  max_full_object_read_mb: 512   # Max size for whole-object reads into memory
  max_buffered_write_mb: 512     # Max size for legacy append/random-write merges
  max_directory_entries: 100000  # Max objects returned for a single directory listing

object_refresh:
  enabled: false      # Enable periodic COS prefix scans for object-side changes
  interval: "5m"      # Scan interval when enabled
  prefix: ""          # COS key prefix to scan; empty scans the mounted bucket view

# Active/passive fencing: exactly one gateway may serve a bucket. The active
# gateway heartbeats a lease object (.nfs-gateway.lease, hidden from the NFS
# namespace); a second gateway refuses to start while a fresh foreign lease
# exists. A standby promotes automatically once the lease is stale (holder
# crashed) or immediately after a graceful shutdown. Break-glass takeover of
# a fresh lease: BLUESTONE_HA_FORCE_TAKEOVER=true (never set in this file).
ha:
  # What to do when this gateway can no longer prove it holds the lease,
  # because another gateway took it or it could not be renewed for longer
  # than lease_timeout: "stop" stops serving and exits 3 (a supervisor can
  # restart it; it will refuse to serve while the other holder is alive),
  # "warn" logs and keeps serving, which risks two writers.
  on_lease_lost: "stop"
  enabled: false
  heartbeat_interval: "15s"
  lease_timeout: "60s"

# SMB server (experimental). Serves the same bucket as NFS to Windows, macOS,
# and Linux SMB clients, with Windows naming: names match case-insensitively
# and characters Windows cannot use are shown as private-use characters.
# Users authenticate with NTLM; keep this file readable only by the gateway's
# service account. server.allowed_clients applies to the SMB port too.
# Port 445 needs root or CAP_NET_BIND_SERVICE on Linux.
smb:
  enabled: false
  port: 445
  share_name: "bluestone"   # clients connect to \\<host>\bluestone
  domain: "BLUESTONE"
  encryption_required: false
  # Highest dialect offered: "3.1.1" (default; AES-GCM encryption and
  # pre-authentication integrity) or "3.0.2" (AES-128-CCM encryption).
  max_dialect: "3.1.1"
  # Reads and writes handled at once per connection. 0 (default) uses the
  # built-in value (64); 1 handles every request in turn, as an escape hatch.
  concurrent_requests: 0
  # How long a shutdown waits for clients to finish what they are doing
  # before closing their connections. A copy in progress finishes; a client
  # that has stopped responding cannot hold up a restart for longer.
  drain_timeout: "30s"
  # Cap on a file's named data streams (alternate data streams: macOS Finder
  # information and extended attributes, Windows download marks), names and
  # contents together. They are kept in the object's metadata: at most 2560
  # on IBM COS, and 1024 for stores with Amazon S3's 2 KB metadata limit.
  max_stream_bytes: 2048
  # Let clients cache the files they read, with read and read-handle leases.
  # Writes are never cached. Changes over NFS break the leases; so do changes
  # made directly in the bucket if object_refresh is enabled. Without it, turn
  # this off if other tools write to the bucket.
  leases: true
  # Keep a client's open files, and their byte-range locks, for up to a
  # minute (at most five if the client asks) when its connection drops, so
  # it reconnects and carries on. Needs leases.
  durable_handles: true
  # What one client can make the gateway hold, and how fast it may keep
  # failing to log in. 0 means no limit; the defaults shown are generous
  # enough that no ordinary client meets them.
  limits:
    max_connections: 256
    max_connections_per_client: 64
    max_sessions_per_connection: 32
    max_trees_per_session: 64
    max_opens_per_session: 4096
    # After auth_failures failed logins from one address within auth_window,
    # that address is refused for auth_block; each further failure doubles
    # the wait up to auth_max_block. A successful login clears the record,
    # so a mistyped password costs a user nothing.
    auth_failures: 5
    auth_window: "5m"
    auth_block: "30s"
    auth_max_block: "15m"
  # users:
  #   - username: "alice"
  #     # The account's NT hash, printed by: bluestone -smb-hash
  #     # (it reads the password from stdin, so it stays out of shell history)
  #     ntlm_hash: "<32 hex characters>"
  #     # password: "change-me"   # deprecated: use ntlm_hash

logging:
  level: "info"     # debug, info, warn, error
  format: "json"    # json or text
  output: "stdout"  # stdout, stderr, or file path

staging:
  enabled: true
  root_dir: "/var/staging/bluestone"
  sync_interval: "30s"
  sync_threshold_mb: 10
  max_dirty_age: "5m"
  sync_on_close: false
  max_staging_size_gb: 10
  max_dirty_files: 1000
  sync_worker_count: 4
  sync_queue_size: 100
  max_sync_retries: 3
  retry_backoff_initial: "1s"
  retry_backoff_max: "60s"
  clean_after_sync: true
  stale_file_age: "24h"
  backpressure_enabled: true
  backpressure_mode: "block"                  # "block" or "fail_fast"
  backpressure_high_watermark_percent: 80     # start slowing/blocking before staging fills
  backpressure_critical_watermark_percent: 95 # reject writes immediately at/above this level
  backpressure_wait_timeout: "30s"
  backpressure_check_interval: "250ms"

